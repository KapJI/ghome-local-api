name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # The Codecov upload authenticates with GitHub OIDC
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ matrix.python-version }}

      # Hook environments (prek) and formatter plugins (dprint) are
      # downloaded on first use; both only change with their config files.
      - name: Cache prek hooks and dprint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek/
            ~/.cache/dprint/
          key: >
            ${{ format('prek-{0}-{1}',
            matrix.python-version,
            hashFiles('.pre-commit-config.yaml', 'dprint.json')
            ) }}
          restore-keys: |
            prek-${{ matrix.python-version }}-

      - name: Run prek on all files
        run: |
          uvx prek run --all-files --show-diff-on-failure --color=always

      - name: Run python-typing-update
        run: |
          uvx prek run --hook-stage manual python-typing-update --all-files --show-diff-on-failure --color=always

      # The runtime floor follows Home Assistant's pin, so test it too. The
      # test header shows the aiohttp version that was resolved.
      - name: Run tests with the lowest allowed dependencies
        run: |
          uv run --isolated --resolution lowest-direct pytest --cov-report=xml

      # Codecov merges the reports from both Python versions; after_n_builds
      # in codecov.yml must match their number. With OIDC the repository needs
      # no Codecov token secret. Pull requests from forks get no OIDC token and
      # upload without one, which Codecov accepts for public repositories.
      - name: Upload coverage to Codecov
        # A failed upload leaves Codecov's report out of date and the commit
        # without Codecov's statuses or an updated comment, but doesn't fail
        # the checks.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          name: Python ${{ matrix.python-version }}
          files: coverage.xml
          disable_search: true
          use_oidc: true
          # Without this, an uploader that fails its signature check still runs.
          fail_ci_if_error: true
          # Download the uploader outside the checkout, so the sdist built
          # below doesn't pick it up.
          cleanup: true

      - name: Build the package
        run: uv build

      # Install the wheel into a new environment and import it with -I, so the
      # source tree can't stand in for it. This catches a wrong package path, a
      # missing typing marker or a missing copyright notice.
      - name: Check the built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -I -c '
          import pathlib
          import sys
          from importlib import metadata

          import ghome_local_api

          dist = metadata.distribution("ghome-local-api")
          assert pathlib.Path(ghome_local_api.__file__) == dist.locate_file("ghome_local_api/__init__.py")
          assert "ghome_local_api/py.typed" in {str(path) for path in dist.files or ()}
          license_text = dist.read_text("licenses/LICENSE") or ""
          for notice in ("Copyright (c) 2020 Ilja Leiko", "Copyright (c) 2026 Ruslan Sayfutdinov"):
              assert notice in license_text, notice
          print(f"ghome-local-api {dist.version} on Python {sys.version}")
          '
