name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ matrix.python-version }}

      # Hook environments (prek) and formatter plugins (dprint) are
      # downloaded on first use; both only change with their config files.
      - name: Cache prek hooks and dprint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek/
            ~/.cache/dprint/
          key: >
            ${{ format('prek-{0}-{1}',
            matrix.python-version,
            hashFiles('.pre-commit-config.yaml', 'dprint.json')
            ) }}
          restore-keys: |
            prek-${{ matrix.python-version }}-

      - name: Run prek on all files
        run: |
          uvx prek run --all-files --show-diff-on-failure --color=always

      - name: Run python-typing-update
        run: |
          uvx prek run --hook-stage manual python-typing-update --all-files --show-diff-on-failure --color=always

      - name: Build the package
        run: uv build

      # Install the wheel into a new environment and import it with -I, so the
      # source tree can't stand in for it. This catches a wrong package path, a
      # missing typing marker or copyright notice and unexpected runtime
      # dependencies.
      - name: Check the built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -I -c '
          import pathlib
          import sys
          from importlib import metadata

          import ghome_local_api

          dist = metadata.distribution("ghome-local-api")
          assert pathlib.Path(ghome_local_api.__file__) == dist.locate_file("ghome_local_api/__init__.py")
          assert "ghome_local_api/py.typed" in {str(path) for path in dist.files or ()}
          assert dist.requires == ["aiohttp>=3.14.4"], dist.requires
          assert dist.metadata["Requires-Python"] == ">=3.12"
          license_text = dist.read_text("licenses/LICENSE") or ""
          for notice in ("Copyright (c) 2020 Ilja Leiko", "Copyright (c) 2021 Ilja Leiko", "Copyright (c) 2026 Ruslan Sayfutdinov"):
              assert notice in license_text, notice
          print(f"ghome-local-api {dist.version} on Python {sys.version}")
          '
